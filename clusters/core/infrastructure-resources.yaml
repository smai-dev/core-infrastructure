apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-resources
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-namespaces
  interval: 10m
  path: ./infrastructure/resources
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
