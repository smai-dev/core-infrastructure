apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-networking
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-namespaces
  interval: 10m
  path: ./infrastructure/networking
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
