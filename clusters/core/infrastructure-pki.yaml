apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-pki
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-cert-manager
  interval: 10m
  path: ./infrastructure/certificates/pki
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
